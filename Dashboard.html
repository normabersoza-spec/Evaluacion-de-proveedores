<script>
  window.__erroresCapturados = [];
  window.addEventListener('error', function(e) {
    window.__erroresCapturados.push((e.message || 'Error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
    mostrarBannerErrores();
  });
  window.addEventListener('unhandledrejection', function(e) {
    window.__erroresCapturados.push('Promise rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    mostrarBannerErrores();
  });
  function mostrarBannerErrores() {
    var banner = document.getElementById('bannerErroresDebug');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'bannerErroresDebug';
      banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#b3261e;color:#fff;font-family:'Inter',sans-serif;font-size:11px;padding:8px;max-height:40vh;overflow-y:auto;white-space:pre-wrap;";
      document.body.insertBefore(banner, document.body.firstChild);
    }
    banner.textContent = 'ERRORES DE JS (' + window.__erroresCapturados.length + '):\n' + window.__erroresCapturados.join('\n\n');
  }
</script>

<style>

  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --card-border: #e3e7ee;
    --header-bg: #f2f4f7;
    --text: #101c2c;
    --text-soft: #55606f;
    --text-faint: #8a94a3;
    --red: #b3261e;
    --red-soft: #fce4e2;
    --green: #146c43;
    --green-soft: #dcf5e9;
    --amber: #92400e;
    --amber-soft: #fef3c7;
    --blue: #0a58ac;
    --blue-soft: #dbeafe;
    --navy: #002a54;
    --navy2: #005fae;
    --shadow: 0 1px 2px rgba(16,28,44,0.06), 0 1px 3px rgba(16,28,44,0.04);
    --sidebar-w: 210px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;
    font-size: 18px;
    line-height: 1;
    vertical-align: middle;
  }

  /* ---------- Topbar (vive dentro de .main-wrap, no atras del sidebar) ---------- */
  .topbar {
    width: 100%;
    height: 64px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--navy2) 100%);
    box-shadow: var(--shadow);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
  .brand-text .titulo { font-family: 'Hanken Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #fff; }

  .tab-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.72);
    padding: 8px 2px;
    border-bottom: 2px solid transparent;
  }
  .tab-btn:hover { color: #fff; }
  .tab-btn.activo { color: #fff; border-bottom-color: #fff; }

  /* ---------- Shell (sidebar fijo + main) ---------- */
  .shell { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100vh;
    width: var(--sidebar-w);
    flex-shrink: 0;
    z-index: 50;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%);
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-logo-box {
    padding: 0 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
  }
  .logo-criotec-sidebar {
    height: 80px;
    width: auto;
    object-fit: contain;
  }

  .main-wrap {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .side-nav { display: flex; flex-direction: column; gap: 4px; }
  .side-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.72);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: left;
    width: 100%;
  }
  .side-nav-item .material-symbols-outlined {
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: rgba(255,255,255,0.10);
    flex-shrink: 0;
  }
  .side-nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .side-nav-item.activo { background: rgba(255,255,255,0.16); color: #fff; }
  .side-nav-item.activo .material-symbols-outlined { background: rgba(255,255,255,0.20); }

  .sidebar-status {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.16);
  }

  .identidad-line {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    line-height: 1.35;
  }
  .identidad-line .punto { font-size: 11px; flex-shrink: 0; }

  .trigger-line {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    line-height: 1.35;
    color: rgba(255,255,255,0.85);
  }
  .btn-activar-trigger {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--navy);
    background: #fff;
    border: 1px solid #fff;
    align-self: flex-start;
  }
  .btn-activar-trigger:hover { opacity: 0.85; }
  .btn-activar-trigger:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Main content ---------- */
  .main-content { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 60px; }
  .content-header { margin-bottom: 16px; }
  .content-header h1 { font-family: 'Hanken Grotesk', sans-serif; font-size: 21px; font-weight: 700; margin: 0 0 3px; color: var(--text); }
  .content-header .sub { font-size: 12.5px; color: var(--text-soft); margin: 0; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-top: 3px solid var(--blue);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .kpi.c-red { border-top-color: var(--red); }
  .kpi.c-amber { border-top-color: var(--amber); }
  .kpi .lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 8px; }
  .kpi .num { font-family: 'Hanken Grotesk', sans-serif; font-size: 28px; font-weight: 800; color: var(--text); }
  .kpi.c-red .num { color: var(--red); }
  .kpi.c-amber .num { color: var(--amber); }
  .kpi.c-blue .num { color: var(--blue); }

  .data-module {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .toolbar {
    padding: 14px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: #fbfcfe;
    margin-bottom: 12px;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 260px;
  }
  .search-wrap .material-symbols-outlined {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); font-size: 20px;
    pointer-events: none;
  }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search-wrap input[type="text"] {
    width: 100%;
    padding: 12px 14px 12px 44px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
  }
  .filtros select {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    cursor: pointer;
  }
  .search-wrap input[type="text"]:focus, .filtros select:focus { outline: none; border-color: var(--navy2); box-shadow: 0 0 0 3px rgba(0,95,174,0.12); }
  select option { color: #0a1728; background: #ffffff; }

  .status-line { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-faint); padding: 10px 14px; border-top: 1px solid var(--card-border); background: #fbfcfe; }

  .tabla-wrap {
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: #c7cedb transparent;
  }
  .tabla-wrap::-webkit-scrollbar { height: 7px; }
  .tabla-wrap::-webkit-scrollbar-track { background: transparent; }
  .tabla-wrap::-webkit-scrollbar-thumb { background: #c7cedb; border-radius: 4px; }
  .tabla-wrap::-webkit-scrollbar-thumb:hover { background: #a9b3c4; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 900px; }
  table.tabla-principal { min-width: 0; }
  .modal-box-ancho { max-width: 100vw; width: 100vw; max-height: 100vh; height: auto; padding: 8px 10px; border-radius: 0; }
  #modalRevisionesOverlay { padding: 0; align-items: flex-start; }
  #modalRevisionesOverlay .tabla-wrap th,
  #modalRevisionesOverlay .tabla-wrap td { padding: 6px 7px; }
  #modalRevisionesOverlay .modal-header { margin-bottom: 0; }
  #modalRevisionesOverlay .tabla-wrap { margin-top: 8px !important; }
  #modalRevisionesOverlay .tabla-wrap table {
    min-width: 0;
    width: 100%;
    table-layout: auto;
  }

  .btn-ver-dibujo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--navy2);
    background: #fff;
    border: 1px solid #bcd6ef;
  }
  .btn-ver-dibujo .material-symbols-outlined { font-size: 18px; }
  .btn-ver-dibujo:hover { background: var(--blue-soft); }
  .btn-ver-dibujo:disabled { opacity: 0.5; cursor: default; }
  thead th {
    position: sticky;
    top: 0;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-soft);
    background: var(--header-bg);
    padding: 12px 12px;
    border-bottom: 1px solid var(--card-border);
    white-space: nowrap;
    z-index: 1;
  }
  tbody tr:hover { background: #f7f9fc; }
  tbody td { padding: 12px 12px; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }

  .codigo { font-family: 'Inter', sans-serif; font-weight: 700; white-space: nowrap; color: var(--navy2); }
  .rev-chip { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700; color: var(--blue); background: var(--blue-soft); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .desc-cell { color: var(--text-soft); max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prov-name-cell { max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag-cell { font-size: 11.5px; color: var(--text-soft); white-space: nowrap; }
  .fecha-cell { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-soft); white-space: nowrap; }

  .select-proveedor {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 6px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    max-width: 160px;
    margin-right: 6px;
  }
  .select-proveedor option { color: #0a1728; background: #ffffff; }

  .btn-enviar-adaptacion {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    background: var(--navy2);
    border: 1px solid var(--navy2);
    white-space: nowrap;
  }
  .btn-enviar-adaptacion:hover { opacity: 0.9; }
  .btn-enviar-adaptacion:disabled { opacity: 0.5; cursor: default; }

  .badge-pill { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid transparent; }
  .badge-pill.fresh { background: var(--green-soft); color: var(--green); border-color: #b7ebd0; }
  .badge-pill.warn { background: var(--amber-soft); color: var(--amber); border-color: #fde3ad; }
  .badge-pill.overdue { background: var(--red-soft); color: var(--red); border-color: #f8c6c1; }

  .prioridad-pill { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid transparent; }
  .prioridad-pill.baja { background: var(--blue-soft); color: var(--blue); border-color: #bfdbfe; }
  .prioridad-pill.media { background: var(--amber-soft); color: var(--amber); border-color: #fde3ad; }
  .prioridad-pill.alta { background: var(--red-soft); color: var(--red); border-color: #f8c6c1; }
  .prioridad-pill.urgente { background: var(--red); color: #fff; }

  .input-comentario {
    width: 100%;
    min-width: 160px;
    background: #fbfcfe;
    border: 1px solid var(--card-border);
    border-radius: 6px;

    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
  }
  .input-comentario:focus { outline: none; border-color: var(--navy2); background: #fff; }
  .input-comentario::placeholder { color: var(--text-faint); }

  .btn-avisar-trabajando {
    font-family: 'Inter', sans-serif;

    font-weight: 600;
    padding: 6px 11px;
    border-radius: 6px;

  .btn-avisar-trabajando:disabled { opacity: 0.5; cursor: default; }

  .btn-cerrar {

    border: 1px solid #b7ebd0;
  }
  .btn-cerrar:hover { background: var(--green-soft); }
  .btn-cerrar:disabled { opacity: 0.5; cursor: default; }

  .btn-cancelar-tarea {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--red);
    background: #fff;

  }
  .btn-cancelar-tarea:hover { background: var(--red-soft); }

  .btn-cotizar {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;

<script>
  (function() {
    function actualizarVistaResponsive() {
      var esMovil = window.innerWidth <= 900;
      document.documentElement.classList.toggle('vista-movil-activa', esMovil);
      document.documentElement.classList.toggle('vista-escritorio-activa', !esMovil);
    }
    actualizarVistaResponsive();
    window.addEventListener('resize', actualizarVistaResponsive);
    window.addEventListener('orientationchange', actualizarVistaResponsive);
    document.addEventListener('DOMContentLoaded', actualizarVistaResponsive);
  })();

<!-- Sin display:none aqui a proposito: #app es hijo directo de <body>, que
     tiene display:flex; flex-direction:column. Alternar el display de un
     hijo flex por JS (none -> block) colapsaba su altura a 0 en algunos
     navegadores (bug de flexbox), dejando la pagina en blanco aunque el
     contenido ya estuviera armado. En vez de eso, #app se queda siempre en
     flujo normal y la pantalla de carga (position:fixed, por encima de
     todo) es la que tapa el contenido mientras cargan los datos. -->
<div id="app">

<?!= include('Dashboard-Movil', { logoUrl: logoUrl }) ?>

<script>
  // Arranque de la app: el HTML de arriba ya se mando y se ve la pantalla
  // de carga; ahora se piden los datos pesados (Sheets/Drive) al servidor.
  // Si esto falla (p.ej. falta autorizacion), se muestra un mensaje con
  // boton de reintentar en vez de dejar la pantalla en blanco.
  function mostrarErrorCargaDashboard(error) {
    if (window.console && console.error) console.error(error);
    var ls = document.getElementById('loadingScreen');
    if (!ls) return;
    ls.innerHTML =
      '<div class="loading-content error-screen">' +
        '<h2>No se pudo cargar la aplicación</h2>' +
        '<p>Ocurrió un problema al conectar con Google. Si esto pasa dentro de una app agregada a la pantalla de inicio, intenta abrir el enlace directo en el navegador (Safari\/Chrome) primero.</p>' +
        '<button onclick="location.reload()">Reintentar</button>' +
      '</div>';
  }

  document.addEventListener('DOMContentLoaded', function() {
    google.script.run
      .withSuccessHandler(function(datos) {
        try {
          if (typeof inicializarVistaEscritorio === 'function') inicializarVistaEscritorio(datos);
          if (typeof inicializarVistaMovil === 'function') inicializarVistaMovil();
        } catch (errInit) {
          mostrarErrorCargaDashboard(errInit);
          return;
        }
        var ls = document.getElementById('loadingScreen');
        if (ls) ls.style.display = 'none';

        // El dashboard se arma agregando muchos elementos al DOM de golpe
        // (google.script.run.withSuccessHandler corre via un puente entre
        // iframes anidados propio de Apps Script). En algunos navegadores
        // eso deja el layout sin recalcular hasta el siguiente evento
        // "normal" del usuario. Forzamos un reflow y repintado explicitos
        // para que el contenido aparezca de inmediato en vez de quedar
        // invisible hasta que algo mas dispare un repintado.
        void document.body.offsetHeight;
        window.dispatchEvent(new Event('resize'));
        if (window.requestAnimationFrame) {
          requestAnimationFrame(function() {
            void document.body.offsetHeight;
          });
        }
      })
      .withFailureHandler(mostrarErrorCargaDashboard)
      .cargarDatosDashboard();
  });
</script>
